<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.pw_reset.title}">Password Reset</title>
</head>
<body>
    <p>Hello <span th:text="${recipient.firstname}">User</span>,</p>

    <p>We received a request to reset your password. Click the link below to set a new password:</p>

    <p>
        <a th:href="${map.baseUrl} + '/#/reset-password?key=' + ${map.resetKey}">
            Reset your password
        </a>
    </p>

    <p>Or copy and paste this link into your browser:</p>
    <p th:text="${map.baseUrl} + '/#/reset-password?key=' + ${map.resetKey}"></p>

    <p>If you did not request a password reset, please ignore this email.</p>

    <hr/>
    <p><small>Help Code: <span th:text="${map.helpCode}">CODE</span></small></p>
</body>
</html>
