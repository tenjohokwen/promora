<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.otp.title}">Verification Code</title>
</head>
<body>
    <p>Hello <span th:text="${recipient.firstname}">User</span>,</p>

    <p>Your verification code is:</p>

    <h2 style="font-size: 32px; letter-spacing: 8px; text-align: center;" th:text="${map.otpCode}">123456</h2>

    <p>This code will expire in 10 minutes.</p>

    <p>If you did not request this code, please ignore this email and ensure your account is secure.</p>

    <hr/>
    <p><small>Help Code: <span th:text="${map.helpCode}">CODE</span></small></p>
</body>
</html>
