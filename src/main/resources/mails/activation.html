<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.activation.title}">Account Activation</title>
</head>
<body>
    <p>Hello <span th:text="${recipient.firstname}">User</span>,</p>

    <p>Thank you for registering. Please click the link below to activate your account:</p>

    <p>
        <a th:href="${map.baseUrl} + '/#/activate?key=' + ${map.activationKey}">
            Activate your account
        </a>
    </p>

    <p>Or copy and paste this link into your browser:</p>
    <p th:text="${map.baseUrl} + '/#/activate?key=' + ${map.activationKey}"></p>

    <p>If you did not register for this account, please ignore this email.</p>

    <hr/>
    <p><small>Help Code: <span th:text="${map.helpCode}">CODE</span></small></p>
</body>
</html>
